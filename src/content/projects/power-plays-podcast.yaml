blocks:
  - heading: Challenge
    body: >-
      Bring Season 1 of Power Plays — on the authoritarian history of the World
      Cup — to a global audience in the lead-up to and during the tournament.
      Break into a crowded podcast space with a limited-run series that had a
      constrained window of relevance.

  - heading: Goal
    body: "25,000 total listeners (5k per episode)."

  - heading: Execution
    bullets:
      - Secured a partnership with Spanish YouTube channel La Media Inglesa to produce a Spanish-language version — at no cost.
      - Hired a podcast strategist to optimize the podcast ecosystem, discoverability, ad buys, and launch strategy.
      - Worked with the creative team on catchy, transferable season and episode graphics to drive the marketing campaign.
      - Developed the pitch to Apple Podcasts' editorial team to secure a platform feature.
      - Negotiated host-read ad buys with Crooked Media, securing a 10k+ discount on rates for Pod Save the World and Pod Save the UK.

  - heading: Advertising channels
    body: >-
      Spotify · PodNews Newsletter (featured ad) · Pocket Casts · Podcast
      Addict · Overcast · Pod Save the World · Pod Save the UK · Meta

  - heading: Impact
    bullets:
      - 130k+ listeners across platforms (and counting)
      - Featured on Apple Podcasts for the duration of the FIFA World Cup
      - 99.1% like ratio on YouTube
      - 4.5k listeners driven directly from ad spend

