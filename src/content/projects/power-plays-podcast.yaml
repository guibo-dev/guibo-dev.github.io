blocks:
  - heading: Challenge
    body: >-
      Launch a limited-run podcast on the authoritarian history of the FIFA
      World Cup into one of the world's most crowded media moments — building
      global attention before interest disappeared with the final whistle.

  - heading: Goal
    body: "Reach 25,000 listeners across five episodes during the World Cup campaign."

  - heading: Execution
    bullets:
      - Secured a partnership with Spain's leading football YouTube channel, La Media Inglesa, to launch a Spanish-language edition of Power Plays. Expanded international reach without increasing production costs.
      - Brought in podcast marketing specialist to strengthen discoverability, refine the launch strategy, and maximize the effectiveness of paid promotion.
      - Partnered with the creative team to develop a flexible visual system that made the campaign instantly recognizable across paid, organic, and partner channels.
      - Developed the editorial pitch that secured featured placement on Apple Podcasts throughout the FIFA World Cup.
      - Negotiated host-read advertising with Crooked Media, extending campaign reach while securing more than $10,000 in discounted placements across Pod Save the World and Pod Save the UK.

  - heading: Advertising channels
    body: >-
      Spotify · PodNews · Pocket Casts · Podcast Addict · Overcast · Pod Save
      the World · Pod Save the UK · Meta

  - heading: Impact
    bullets:
      - Reached more than 130,000 listeners across platforms.
      - Featured across Apple Podcasts throughout the FIFA World Cup.
      - Achieved a 99.1% audience approval rating on YouTube.
      - Generated more than 6,000 attributable listeners through paid media.

partner_tags:
