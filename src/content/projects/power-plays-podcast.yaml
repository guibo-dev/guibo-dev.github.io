blocks:
  - heading: Challenge
    body: >-
      Launch a limited-run podcast on the authoritarian history of the FIFA
      World Cup into one of the world's most crowded media moments. How do you
      capture global attention before interest disappears with the final
      whistle?

  - heading: Goal
    body: "Reach 25,000 listeners across five episodes during the World Cup campaign."

  - heading: Execution
    bullets:
      - Secured a no-cost partnership with Spain's leading football YouTube channel, La Media Inglesa, to launch a Spanish-language edition of Power Plays, expanding international reach without increasing production costs.
      - Brought in a podcast marketing specialist to improve discoverability, refine launch strategy, and maximise paid promotion.
      - Worked with the in-house creative team to develop a flexible visual system that made the campaign instantly recognisable across paid, organic, and partner channels.
      - Developed the editorial pitch that secured featured placement on Apple Podcasts throughout the FIFA World Cup.

  - heading: Advertising channels
    body: >-
      Spotify · PodNews · Pocket Casts · Podcast Addict · Overcast · Pod Save
      the World · Pod Save the UK · Meta

  - heading: Impact
    bullets:
      - Reached more than 140,000 listeners across platforms.
      - Featured across Apple Podcasts throughout the FIFA World Cup.
      - Achieved a 99.1% audience approval rating on YouTube.
      - Generated more than 6,000 attributable listeners through paid media.

