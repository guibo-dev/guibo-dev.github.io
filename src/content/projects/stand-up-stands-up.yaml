blocks:
  - heading: About Stand-Up Stands Up
    body: |-
      This is the comedy show you were never supposed to see.

      Stand-Up Stands Up premiered at the 2026 Oslo Freedom Forum — a night of stand-up celebrating comedians who keep performing, keep writing, keep making people laugh even when it can lead to censorship, imprisonment, or exile.

      Stand-up wraps truth in a punchline. It makes power look ridiculous. And that makes a lot of dictators very, very nervous.

      Simply put: dictators cannot take a joke.

      Come for the jokes. Stay for what they mean.

  - heading: Challenge
    bullets:
      - Win budget and leadership approval for a format with no precedent at the Forum
      - Identify and secure comedians performing under censorship, imprisonment, or exile. Talent no roster lists.
      - Find a venue, produce the show, and sell it out
      - Build an audience beyond the room, before and after the night itself

