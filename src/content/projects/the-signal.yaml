blocks:
  - heading: Overview
    body: >-
      The Signal is an independent current-affairs publication — no
      broadcast-rights deals, no access-journalism constraints, no commercial
      conflicts with the subjects it covers — with distinctive editorial and
      creative capabilities and an expanding, highly engaged audience in the
      U.S. and worldwide. Together we produced a series of print products and
      activations exploring how autocratic power operates.

  - heading: Altered States
    body: >-
      A limited-run newspaper examining how dictators use power and illicit
      wealth to undermine democracy and strengthen authoritarianism, asking:
      How much influence do foreign autocratic regimes have on democracies?


      Event activation: Brought the newspaper to life with a Washington, D.C.
      launch event for policymakers, journalists, think tanks, and professors —
      establishing HRF as a thought leader on kleptocracy and foreign lobbying.
    gallery: Altered States

  - heading: Kleptocrats Dossier
    body: >-
      How do you make kleptocracy fun?


      A corruption dossier containing everything a U.S. congressman would need
      to lobby for a foreign government: plane tickets to the Cayman Islands;
      ID cards of famous U.S. senators and the countries they sold their
      influence to; a bribery cheat sheet for the easiest way to buy political
      influence in the U.S. as a foreign government.
    gallery: Kleptocrats Dossier

  - heading: Shadow Play
    badge: Upcoming — Launching August 2026
    body: >-
      A fanzine-inspired print magazine exploring autocratic influence in
      global football — combining original journalism, fan voices, and advocacy
      expertise. It targets two overlapping audiences no publication has served
      together: the football fan who wants to understand how the sport they
      love is changing, and the current-affairs reader who wants to understand
      how dictators build influence.


      Vision:
    bullets:
      - Syndicate with outlets
      - Give fans a product that speaks their language
    gallery: Shadow Play Previews

