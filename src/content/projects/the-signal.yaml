blocks:
  - heading: Overview
    body: >-
      The Signal's independent editorial model made it an ideal creative
      partner for tackling stories traditional media often overlooks. Together,
      we developed a series of print publications and public activations that
      translated complex geopolitical issues into accessible, highly visual
      storytelling.

  - heading: Altered States
    body: >-
      A limited-edition newspaper asking a simple question: How much influence
      do authoritarian regimes already have inside democratic societies?

  - heading: Event Activation
    body: >-
      Extended the publication into a Washington, D.C. launch event that brought
      policymakers, journalists, academics, and researchers into the same
      conversation — turning editorial content into a live forum on kleptocracy
      and foreign influence.

  - heading: Kleptocrats Dossier
    body: |-
      How do you make kleptocracy fun?

      We turned corruption into an interactive prop. Designed as the ultimate lobbying starter kit, the dossier included fake Cayman Islands boarding passes, congressional ID cards, and satirical "how-to" guides that exposed just how easily foreign governments can purchase political influence.
    gallery: Altered States

  - heading: Shadow Play
    badge: Launching August 2026
    body: |-
      A fanzine-inspired magazine investigating how authoritarian regimes use football to build influence, launder reputations, and reshape global narratives.

      Built for the overlooked intersection between football supporters and geopolitical readers, Shadow Play translates complex political influence into the language of the world's biggest sport.

  - heading: Vision
    bullets:
      - Syndicate investigations and stories through leading global publications.
      - Create the first publication equally at home in football culture and foreign policy discourse.
      - Shift authoritarian influence in football from a niche policy issue into mainstream sporting conversation.
    gallery: Shadow Play Previews

