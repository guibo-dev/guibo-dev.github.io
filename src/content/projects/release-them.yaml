blocks:
  - heading: About
    body: |-
      As Xi Jinping arrived in the United States for a summit framed around trade, technology, and great-power diplomacy, HRF built the counterpoint. Centered on eight prisoners of conscience, the campaign made Xi's human rights abuses impossible to ignore and pressed for accountability from him and the Chinese Communist Party.

      The eight are a student, a legislator, a professor, a doctor, an artist, and three pastors — ordinary people imprisoned by Xi's government for ordinary acts, each one protected under international human rights law. They are defined by their passions and their livelihoods, not by the cells the CCP has arbitrarily placed them in.

  - heading: Challenge
    bullets:
      - Create an unmissable moment in Washington, DC, that put the prisoners' cases in front of the world
      - Orchestrate a cohesive media, social, and experiential campaign built to drive coverage
      - Run multiple vendors, stunts, and interviews in parallel, on a single timeline
      - Break a multi-layered campaign through into national and international media

  - heading: Strategy
    bullets:
      - "Live projections across some of DC's most recognizable landmarks: the National Gallery of Art, the Wilson Memorial Arch, Memorial Bridge, and the US Department of Agriculture"
      - A full-page ad in Roll Call, Capitol Hill's most-read newspaper
      - Six trucks circling DC's busiest streets, timed to Xi Jinping's arrival
      - Coordinated press and wire photography to capture the moment and carry the prisoners' cases — and their families — into the news cycle

  - heading: Goals
    bullets:
      - Generate significant coverage in Washington, DC, nationally, and internationally
      - Humanize the innocent individuals imprisoned in China, across the full range of who they are
      - Force human rights onto the agenda of Xi Jinping's visit

  - heading: Impact
    bullets:
      - $4,354.93 raised in online donations
      - Scale — roughly 25 high-quality placements across 19 distinct outlets
      - "Priority outlets: CNN with Jake Tapper, LiveNow Fox, The Epoch Times, and RealClearPolitics, plus wire photography from Reuters, AFP, and Getty"
      - On-site press — 9 journalists and news photographers covered the installation directly
      - "Social media: 184K+ impressions, 38K+ reach, 6.6K+ engagements, and 952 shares"
    gallery: Release Them

proof_lede: "Coverage from the week Xi Jinping came to Washington — in DC, nationally, and internationally."
