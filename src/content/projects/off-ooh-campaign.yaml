blocks:
  - heading: Challenge
    body: >-
      For 16 years, the Oslo Freedom Forum has drawn the world's leading human
      rights voices to Oslo. Yet outside the circle of journalists and
      advocates who already knew it, the city hosting it barely noticed.

  - heading: Objectives
    bullets:
      - Make Oslo residents recognise the Forum happening in their own city.
      - Establish it as the definitive global stage for human rights advocacy.
      - Anchor its identity to the activists whose faces the public already trust.

  - heading: Role
    bullets:
      - Set the campaign's goals, vision, and creative direction
      - Negotiated the media buy, image rights, and talent consent
      - Briefed and directed the in-house creative team
      - Secured sign-off from senior leadership at every stage
      - Owned the campaign end-to-end, from strategy to placement

  - heading: Impact
    bullets:
      - 53% positive brand impression among surveyed Oslo residents
      - 2M+ impressions across the campaign
      - 450k+ views across X posts (400+ re-shares)
      - $13K saved through direct negotiation on media buy and image rights

