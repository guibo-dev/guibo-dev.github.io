blocks:
  - heading: Challenge
    body: >-
      The Oslo Freedom Forum has run annually in Oslo for 16 years. Industry
      professionals and journalists know it well, but Oslo's general public
      remained largely unaware of the event.

  - heading: Objectives
    bullets:
      - Build positive brand recognition among Oslo residents
      - Position the Oslo Freedom Forum as a premier event for human rights advocacy
      - Associate the Forum with highly recognizable, respected human rights activists

  - heading: Role
    bullets:
      - Managed the campaign end-to-end
      - Negotiated the media buy, image rights, and talent consent
      - Established campaign goals and vision
      - Briefed and collaborated with the in-house creative team
      - Handled all approvals with senior leadership

  - heading: Impact
    bullets:
      - 2M+ impressions
      - 450 retweets and 450k+ views on X
      - 53% positive brand impression among surveyed residents
      - $13K in negotiated savings

