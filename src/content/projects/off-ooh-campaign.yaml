slug: off-ooh-campaign
title: Oslo Freedom Forum OOH Campaign
descriptor: "A $100K out-of-home campaign that took the Oslo Freedom Forum from insider-known to city-wide recognition: 2M+ impressions, 53% positive brand lift."
tier: Flagship Campaigns
role_tag: Campaign lead
