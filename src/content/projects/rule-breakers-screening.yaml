blocks:
  - heading: Overview
    body: |-
      Hosted an exclusive screening of Rule Breakers for HRF donors and strategic partners, bringing supporters closer to the story of Roya Mahboob, Afghanistan's first female tech CEO and the leader behind the country's pioneering all-girls robotics team.

      The evening concluded with a personal conversation exploring technology, education, and the fight for opportunity under authoritarian rule.

  - heading: Goal
    body: >-
      Strengthen relationships with HRF's supporters through an intimate
      experience that combined storytelling, conversation, and direct access to
      one of the world's leading voices on technology and freedom.

