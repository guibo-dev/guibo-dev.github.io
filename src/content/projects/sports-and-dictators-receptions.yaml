blocks:
  - heading: Overview
    body: |-
      HRF's Sports & Dictators program had long explored the intersection of sports, authoritarianism, and human rights through research, journalism, and advocacy, but its work remained largely within a niche audience.

      With the 2026 World Cup approaching and global scrutiny of governance in sport intensifying, we identified an opportunity to elevate the program from a research initiative into a broader cultural conversation. The goal wasn't simply to launch new projects; it was to reposition sports as a powerful entry point for understanding authoritarian influence.

      To launch this next chapter, we hosted two invite-only receptions during the Oslo Freedom Forum introducing Power Plays and previewing Shadow Play, creating a strategic platform for HRF's Sports & Dictators program to engage journalists, industry leaders, and global conference attendees.

  - heading: Program
    entries:
      - term: Opening Remarks
        detail: Karim Zidan, HRF Sports & Dictators Program Lead
      - term: Featured Conversation
        detail: John Gould, Editor-in-Chief of The Signal, and Dr. Zohreh Abdollakhani, Iranian ice climbing champion and Chair of Human Rights for Sport, on the intersection of sport, authoritarianism, and human rights.

