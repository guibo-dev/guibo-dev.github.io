descriptor: Led the strategy, execution, and optimization of Oslo Freedom Forum's official event app, driving 90% attendee adoption, a 15% year-over-year increase, and a 4.5/5 satisfaction rating.
tier: Digital Content Management
role_tag: Product Lead
order: 1

