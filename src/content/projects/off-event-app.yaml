blocks:
  - heading: Role
    bullets:
      - Managed CRM-to-app content workflows, ensuring accurate and timely event information across attendee-facing experiences.
      - Coordinated Salesforce integration partners to maintain seamless data connections between internal systems and the attendee app.
      - Built and maintained the digital conference experience, ensuring accurate schedules, speaker profiles, and attendee resources.
      - Led real-time app operations during the conference, managing updates, attendee communications, and technical troubleshooting.

  - heading: Impact
    bullets:
      - 90% attendee adoption
      - 4.5/5 satisfaction rating
      - 15% increase in adoption year-over-year

